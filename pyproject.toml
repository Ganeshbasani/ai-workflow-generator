[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workflow-generator"
version = "1.0.0"
description = "Structured, domain-aware workflow generation with a deterministic offline engine"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fpdf2==2.9.0",
    "pypdf==7.1.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "openai==3.57.0",
    "fastapi==0.165.0",
    "python-multipart==0.0.34",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "streamlit==1.67.0",
    "pandas==3.1.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.5",
    "mypy==2.4.1",
    "httpx==0.28.1",
    "pre-commit==4.7.0",
    "pip-audit==2.10.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
filterwarnings = [
    "ignore:.*missing ScriptRunContext.*:UserWarning",
    "ignore:.*bare mode.*:UserWarning",
]

[tool.coverage.run]
source = ["src", "app", "workflow"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "."]
exclude = ["fonts", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app.py" = ["E402", "E501"]  # CSS block is verbatim from the original design
"api.py" = ["E402"]  # ASGI shim must extend sys.path before importing the package
"workflow.py" = ["E402"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["^tests/"]

[[tool.mypy.overrides]]
module = ["streamlit.*", "fpdf.*", "pypdf.*"]
ignore_missing_imports = true
