name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: gitleaks → ruff → mypy → pytest → pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build React application
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip==25.0.1"
          python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy (strict)
        run: mypy src app.py workflow.py api.py

      - name: Pytest + coverage gate
        run: |
          pytest -q \
            --cov=workflow_ai --cov=app \
            --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=85 \
            -W error::DeprecationWarning

      - name: pip-audit
        run: pip-audit -r requirements-dev.txt

  docker:
    name: Clean-clone image smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ai-workflow-generator:ci .

      - name: Start container
        run: docker run -d --name awg-smoke -p 8000:8000 ai-workflow-generator:ci

      - name: Wait for health and verify OpenAPI
        run: |
          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = "1"
          curl -fsS http://127.0.0.1:8000/openapi.json \
            | python -c "import json,sys; paths=json.load(sys.stdin)['paths']; assert '/api/v1/workflows/generate' in paths"

      - name: Container logs
        if: always()
        run: docker logs awg-smoke || true

      - name: Remove container
        if: always()
        run: docker rm -f awg-smoke || true

  deploy:
    name: Publish tagged image to GHCR
    runs-on: ubuntu-latest
    needs: [quality, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
